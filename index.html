<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMX Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* ensures video is fully visible without cropping. Set to 'cover' if you want no black bars */
            transition: opacity 0.5s ease-in-out;
        }
        .active {
            opacity: 1;
            z-index: 2;
        }
        .hidden {
            opacity: 0;
            z-index: 1;
        }
        /* Temporary debug info */
        #debug-info {
            display: none; /* Hidden as per request */
            position: absolute;
            top: 10px;
            left: 10px;
            color: lime;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            pointer-events: none;
        }
        /* Setup Overlay */
        #setup-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        #setup-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        #setup-overlay input {
            font-size: 2rem;
            padding: 10px 20px;
            width: 500px;
            text-align: center;
            border-radius: 10px;
            border: 2px solid #555;
            background: #222;
            color: white;
            margin-bottom: 20px;
        }
        #setup-overlay button {
            font-size: 2rem;
            padding: 10px 40px;
            cursor: pointer;
            background: #00e5ff;
            color: black;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }
        #setup-overlay button:hover {
            background: #00b3cc;
        }
        /* Registration Overlay */
        #registration-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        #registration-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        #registration-overlay h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        #registration-overlay .code-box {
            font-size: 6rem;
            font-weight: bold;
            background: #222;
            padding: 20px 40px;
            border-radius: 15px;
            letter-spacing: 10px;
            border: 2px solid #555;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.2);
            color: #00e5ff;
        }
        /* Download Overlay */
        #download-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 15px 25px;
            color: #00e5ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.2rem;
            z-index: 40;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            border: 1px solid #00e5ff;
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #download-overlay.show {
            opacity: 1;
        }
        .spinner {
            width: 25px;
            height: 25px;
            border: 3px solid rgba(0, 229, 255, 0.3);
            border-top: 3px solid #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Error Overlay */
        #error-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            border-radius: 10px;
            padding: 20px 40px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #error-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        #error-overlay h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
        }
        #error-overlay p {
            font-size: 1.2rem;
            margin: 0 0 20px 0;
        }
        #error-overlay button {
            font-size: 1.2rem;
            padding: 8px 30px;
            cursor: pointer;
            background: white;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        #error-overlay button:hover {
            background: #eee;
        }
    </style>
</head>
<body>
    <div id="setup-overlay">
        <h1>CMS Setup</h1>
        <p style="font-size: 1.5rem; color: #aaa;">Enter the CMS Portal URL:</p>
        <input type="text" id="cms-url-input" value="" />
        <button id="connect-btn">Connect</button>
    </div>
    <div id="registration-overlay">
        <h1>Player Not Registered</h1>
        <p style="font-size: 1.5rem; color: #aaa;">Please enter this code on the CMS Portal to link this screen:</p>
        <div class="code-box" id="enrollment-code">------</div>
    </div>
    <div id="debug-info">Player Status: Waiting...</div>
    <!-- Download overlay removed — downloads happen silently in background -->
    <div id="error-overlay">
        <h1>Error</h1>
        <p id="error-text">An error occurred.</p>
        <button id="close-error-btn">Dismiss</button>
    </div>
    <div class="video-container">
        <!-- Double buffering setup -->
        <video id="playerA" class="active"></video>
        <video id="playerB" class="hidden"></video>
        <!-- Image display element (for PNG/JPG/GIF/WebP content) -->
        <img id="imagePlayer" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;z-index:5;" />
        <!-- Video wall crop canvas -->
        <canvas id="cropCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:6;background:#000;"></canvas>
        <!-- Capture card video element -->
        <video id="capturePlayer" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; z-index:100;" autoplay muted></video>
        <!-- Native live input (DeckLink / NDI) rendered from raw frames -->
        <canvas id="liveCanvas" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; z-index:100; background:#000;"></canvas>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
